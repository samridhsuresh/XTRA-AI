<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B12">
<title>XTRA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/17.0.1/lib/marked.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.11/purify.min.js"></script>
<style>
  :root{
    --ink-950:#0B0B12;
    --ink-900:#16151F;
    --ink-850:#1B1A26;
    --ink-800:#201F2D;
    --ink-700:#2C2A3B;
    --ink-600:#3A3750;
    --violet-500:#7C5CFC;
    --violet-400:#9478FF;
    --violet-300:#B9A9FF;
    --coral-500:#FF6B4A;
    --coral-400:#FF8A6B;
    --mist-300:#9E9CB8;
    --mist-200:#C7C6D9;
    --paper:#F3F2FA;
    --danger:#FF5470;
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --font-display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    --font-body:'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background-color:var(--ink-950);
    background-image:
      radial-gradient(circle at 15% -10%, rgba(124,92,252,0.16), transparent 55%),
      radial-gradient(circle at 100% 8%, rgba(255,107,74,0.10), transparent 45%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 42px);
    background-attachment:fixed;
    color:var(--paper);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #app{ height:100vh; width:100%; display:flex; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--ink-700); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--ink-600); }
  :focus-visible{ outline:2px solid var(--coral-500); outline-offset:2px; border-radius:4px; }

  /* ---------- spark mark ---------- */
  .spark-mark{ display:block; }
  .spark.thinking{ animation:sparkPulse 1.6s ease-in-out infinite; transform-origin:50% 50%; }
  @keyframes sparkPulse{
    0%,100%{ transform:scale(1) rotate(0deg); opacity:1; }
    50%{ transform:scale(1.14) rotate(10deg); opacity:.72; }
  }
  @media (prefers-reduced-motion:reduce){
    .spark.thinking{ animation:none; }
    *{ scroll-behavior:auto !important; }
  }

  /* ---------- auth screens ---------- */
  .auth-screen{
    width:100%; min-height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:1.75rem; padding:2rem 1.25rem; text-align:center; overflow-y:auto;
  }
  .brand-row{ display:flex; align-items:center; gap:.65rem; }
  .brand-word{ font-family:var(--font-display); font-weight:700; font-size:1.9rem; letter-spacing:-0.02em; }
  .brand-tagline{ color:var(--mist-300); font-size:.95rem; max-width:360px; line-height:1.5; margin-top:-.75rem; }
  .profile-grid{ display:flex; flex-wrap:wrap; gap:1rem; justify-content:center; max-width:640px; }
  .profile-card{
    width:128px; display:flex; flex-direction:column; align-items:center; gap:.6rem;
    padding:1.15rem .75rem; border-radius:var(--radius-md); background:var(--ink-900);
    border:1px solid var(--ink-700); cursor:pointer; transition:transform .15s ease, border-color .15s ease;
  }
  .profile-card:hover, .profile-card:focus-visible{ transform:translateY(-3px); border-color:var(--violet-500); }
  .profile-card.add-card{ background:transparent; border-style:dashed; color:var(--mist-300); justify-content:center; }
  .profile-avatar{
    width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:1.15rem; color:#100E1A; flex-shrink:0;
  }
  .profile-name{ font-size:.875rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .add-icon{
    width:56px; height:56px; border-radius:50%; border:1px dashed var(--ink-600);
    display:flex; align-items:center; justify-content:center; font-size:1.4rem; color:var(--mist-300);
  }
  .create-form{ display:flex; flex-direction:column; gap:.85rem; width:100%; max-width:340px; }
  .create-form input{
    background:var(--ink-900); border:1px solid var(--ink-700); border-radius:var(--radius-sm);
    padding:.8rem 1rem; color:var(--paper); font-size:1rem; font-family:var(--font-body); outline:none;
  }
  .create-form input:focus{ border-color:var(--violet-500); }
  .btn-primary{
    background:linear-gradient(135deg,var(--violet-500),var(--coral-500)); color:#fff; border:none;
    border-radius:var(--radius-sm); padding:.8rem 1rem; font-weight:600; font-size:.95rem; cursor:pointer;
  }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .link-btn{ background:none; border:none; color:var(--mist-300); font-size:.85rem; cursor:pointer; text-decoration:underline; padding:.25rem; }
  .link-btn:hover{ color:var(--paper); }
  .auth-footnote{ color:var(--mist-300); font-size:.78rem; max-width:380px; line-height:1.5; }

  /* ---------- app shell ---------- */
  .shell{ display:flex; width:100%; height:100%; position:relative; }
  .sidebar{
    width:272px; flex-shrink:0; background:var(--ink-900); border-right:1px solid var(--ink-700);
    display:flex; flex-direction:column; height:100%;
  }
  .sidebar-header{ padding:1.1rem 1rem .3rem; display:flex; align-items:center; gap:.55rem; }
  .sidebar-header .brand-word{ font-size:1.15rem; }
  .new-chat-btn{
    margin:.85rem 1rem 0.6rem; padding:.65rem .9rem; border-radius:var(--radius-sm);
    background:linear-gradient(135deg,var(--violet-500),var(--coral-500)); color:#fff; font-weight:600;
    font-size:.875rem; border:none; cursor:pointer; display:flex; gap:.5rem; align-items:center; justify-content:center;
  }
  .new-chat-btn:hover{ filter:brightness(1.08); }
  .conv-list{ flex:1; overflow-y:auto; padding:.35rem .5rem; display:flex; flex-direction:column; gap:2px; }
  .conv-item{
    padding:.6rem .65rem; border-radius:var(--radius-sm); cursor:pointer; display:flex; justify-content:space-between;
    align-items:center; gap:.4rem; color:var(--mist-200); font-size:.84rem; border:1px solid transparent;
  }
  .conv-item:hover{ background:var(--ink-850); }
  .conv-item.active{ background:var(--ink-800); color:var(--paper); border-color:var(--ink-700); }
  .conv-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .conv-delete{
    opacity:0; background:none; border:none; color:var(--mist-300); cursor:pointer; padding:.2rem;
    display:flex; border-radius:4px; flex-shrink:0;
  }
  .conv-item:hover .conv-delete, .conv-delete:focus-visible{ opacity:1; }
  .conv-delete:hover{ color:var(--danger); }
  .conv-empty{ color:var(--mist-300); font-size:.8rem; padding:1rem .75rem; line-height:1.5; }
  .sidebar-footer{
    padding:.85rem 1rem; border-top:1px solid var(--ink-700); display:flex; flex-direction:column; gap:.55rem;
  }
  .profile-chip{ display:flex; align-items:center; gap:.6rem; }
  .profile-chip .profile-avatar{ width:32px; height:32px; font-size:.8rem; }
  .profile-chip-name{ font-size:.85rem; font-weight:500; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .footer-links{ display:flex; justify-content:space-between; align-items:center; }
  .footer-links .link-btn{ font-size:.75rem; padding:0; }

  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; }
  .main-header{
    height:54px; flex-shrink:0; display:flex; align-items:center; gap:.75rem; padding:0 1.1rem;
    border-bottom:1px solid var(--ink-700);
  }
  .menu-toggle{ display:none; background:none; border:none; color:var(--paper); cursor:pointer; padding:.3rem; }
  .main-header .spark-mark{ width:20px; height:20px; }
  .main-header .brand-word{ font-size:1rem; }

  .messages{ flex:1; overflow-y:auto; padding:1.5rem 0 .5rem; }
  .msg-row{ max-width:720px; width:100%; margin:0 auto; display:flex; gap:.8rem; padding:0 1.25rem; margin-bottom:1.25rem; }
  .msg-row.user{ flex-direction:row-reverse; }
  .msg-avatar{ width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .msg-avatar.ai{ background:var(--ink-800); border:1px solid var(--ink-700); }
  .msg-avatar.ai svg{ width:16px; height:16px; }
  .msg-col{ display:flex; flex-direction:column; gap:.3rem; max-width:calc(100% - 44px); }
  .msg-row.user .msg-col{ align-items:flex-end; }
  .msg-bubble{ padding:.7rem 1rem; border-radius:var(--radius-md); line-height:1.6; font-size:.93rem; }
  .msg-row.assistant .msg-bubble{ background:var(--ink-900); border:1px solid var(--ink-700); border-top-left-radius:4px; }
  .msg-row.user .msg-bubble{ background:var(--violet-500); color:#fff; border-top-right-radius:4px; white-space:pre-wrap; word-break:break-word; }
  .msg-row.assistant .msg-bubble.is-error{ border-color:var(--danger); color:#FFD3DB; }
  .msg-bubble p{ margin:0 0 .65em; }
  .msg-bubble p:last-child{ margin-bottom:0; }
  .msg-bubble ul, .msg-bubble ol{ margin:.3em 0 .65em; padding-left:1.3em; }
  .msg-bubble li{ margin:.2em 0; }
  .msg-bubble a{ color:var(--violet-300); }
  .msg-bubble pre{
    background:var(--ink-950); border:1px solid var(--ink-700); padding:.8rem .9rem; border-radius:var(--radius-sm);
    overflow-x:auto; font-family:var(--font-mono); font-size:.8rem; margin:.5em 0;
  }
  .msg-bubble code{ font-family:var(--font-mono); }
  .msg-bubble :not(pre) > code{ background:var(--ink-800); padding:.15em .4em; border-radius:4px; font-size:.85em; }
  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3{ font-family:var(--font-display); margin:.6em 0 .35em; line-height:1.3; }
  .msg-bubble blockquote{ margin:.4em 0; padding-left:.8em; border-left:2px solid var(--ink-600); color:var(--mist-200); }
  .msg-row.assistant .msg-actions{ display:flex; gap:.4rem; opacity:0; transition:opacity .12s ease; }
  .msg-row.assistant:hover .msg-actions{ opacity:1; }
  .msg-icon-btn{
    background:none; border:none; color:var(--mist-300); cursor:pointer; font-size:.72rem; font-family:var(--font-mono);
    display:flex; align-items:center; gap:.3rem; padding:.15rem .3rem; border-radius:4px;
  }
  .msg-icon-btn:hover{ color:var(--paper); background:var(--ink-850); }
  .thinking-caption{ font-family:var(--font-mono); font-size:.72rem; letter-spacing:.05em; color:var(--mist-300); text-transform:uppercase; padding:.2rem 0; }

  .welcome{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.35rem; padding:2rem 1.25rem; text-align:center; }
  .welcome .spark-mark{ width:52px; height:52px; }
  .welcome h1{ font-family:var(--font-display); font-size:1.5rem; margin:0; font-weight:600; }
  .welcome p{ color:var(--mist-300); font-size:.9rem; max-width:380px; margin:0; line-height:1.5; }
  .suggestion-chips{ display:flex; flex-wrap:wrap; gap:.55rem; justify-content:center; max-width:560px; }
  .chip{
    padding:.55rem 1rem; border-radius:999px; border:1px solid var(--ink-700); background:var(--ink-900);
    color:var(--mist-200); font-size:.83rem; cursor:pointer;
  }
  .chip:hover{ border-color:var(--violet-500); color:var(--paper); }

  .composer{ border-top:1px solid var(--ink-700); padding:.9rem 1.25rem 1.1rem; flex-shrink:0; }
  .composer-inner{
    max-width:720px; margin:0 auto; display:flex; align-items:flex-end; gap:.6rem; background:var(--ink-900);
    border:1px solid var(--ink-700); border-radius:var(--radius-lg); padding:.5rem .5rem .5rem 1.05rem;
  }
  .composer-inner:focus-within{ border-color:var(--violet-500); }
  #composerTextarea{
    flex:1; background:transparent; border:none; outline:none; resize:none; color:var(--paper);
    font-family:var(--font-body); font-size:.93rem; max-height:200px; padding:.5rem 0; line-height:1.5;
  }
  #composerTextarea::placeholder{ color:var(--mist-300); }
  #composerTextarea:disabled{ opacity:.5; }
  .send-btn{
    width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--violet-500),var(--coral-500));
    border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .send-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .composer-note{ text-align:center; color:var(--mist-300); font-size:.72rem; margin-top:.6rem; }

  /* ---------- modal ---------- */
  .modal-scrim{
    position:fixed; inset:0; background:rgba(6,6,10,0.6); display:none; align-items:center; justify-content:center;
    z-index:60; padding:1rem;
  }
  .modal-scrim.show{ display:flex; }
  .modal-card{
    background:var(--ink-900); border:1px solid var(--ink-700); border-radius:var(--radius-md); padding:1.35rem;
    max-width:340px; width:100%; display:flex; flex-direction:column; gap:.9rem;
  }
  .modal-card h3{ margin:0; font-family:var(--font-display); font-size:1.05rem; }
  .modal-card p{ margin:0; color:var(--mist-300); font-size:.87rem; line-height:1.5; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:.6rem; }
  .btn-ghost{ background:none; border:1px solid var(--ink-700); color:var(--paper); border-radius:var(--radius-sm); padding:.55rem .95rem; font-size:.85rem; cursor:pointer; }
  .btn-ghost:hover{ border-color:var(--ink-600); }
  .btn-danger{ background:var(--danger); color:#fff; border:none; border-radius:var(--radius-sm); padding:.55rem .95rem; font-size:.85rem; cursor:pointer; }
  .btn-danger:hover{ filter:brightness(1.08); }

  /* ---------- mobile sidebar overlay ---------- */
  .sidebar-scrim{ display:none; }
  @media (max-width:860px){
    .menu-toggle{ display:flex; }
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:50; transform:translateX(-100%);
      transition:transform .2s ease; box-shadow:2px 0 24px rgba(0,0,0,.4);
    }
    .sidebar.open{ transform:translateX(0); }
    .sidebar-scrim{
      display:none; position:fixed; inset:0; background:rgba(6,6,10,0.55); z-index:45;
    }
    .sidebar-scrim.show{ display:block; }
    .msg-row{ padding:0 .85rem; }
    .composer{ padding:.75rem .85rem .95rem; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-scrim" id="modalScrim">
  <div class="modal-card" role="alertdialog" aria-modal="true" id="modalCard">
    <h3 id="modalTitle"></h3>
    <p id="modalMessage"></p>
    <div class="modal-actions">
      <button class="btn-ghost" id="modalCancelBtn">Cancel</button>
      <button class="btn-danger" id="modalConfirmBtn">Confirm</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ======================= constants ======================= */
  var AVATAR_GRADIENTS = [
    'linear-gradient(135deg,#7C5CFC,#FF6B4A)',
    'linear-gradient(135deg,#4C9AFF,#7C5CFC)',
    'linear-gradient(135deg,#FF6B4A,#FFB84C)',
    'linear-gradient(135deg,#34D1BF,#7C5CFC)',
    'linear-gradient(135deg,#FF6B9D,#7C5CFC)',
    'linear-gradient(135deg,#7C5CFC,#34D1BF)'
  ];
  var SUGGESTIONS = [
    'Explain a tricky concept simply',
    'Debug a piece of code with me',
    'Draft an email for me',
    'Help me plan something step by step'
  ];
  var SYSTEM_PROMPT = 'You are XTRA AI, a direct and capable assistant. Give clear, complete, well-organized answers.';

  /* ======================= storage helpers ======================= */
  function storageGet(key){
    return window.storage.get(key, false).then(function(res){
      return res ? JSON.parse(res.value) : null;
    }).catch(function(){ return null; });
  }
  function storageSet(key, value){
    return window.storage.set(key, JSON.stringify(value), false).then(function(res){
      return !!res;
    }).catch(function(e){ console.error('storage set failed', key, e); return false; });
  }
  function storageDelete(key){
    return window.storage.delete(key, false).then(function(){ return true; }).catch(function(){ return false; });
  }

  /* ======================= utils ======================= */
  function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function truncate(s, n){ s = s.trim(); return s.length > n ? s.slice(0, n).trim() + '…' : s; }
  function initials(name){
    var parts = name.trim().split(/\s+/);
    return parts.slice(0, 2).map(function(w){ return w[0] ? w[0].toUpperCase() : ''; }).join('');
  }
  function timeAgo(ts){
    var diff = Date.now() - ts;
    var m = Math.floor(diff / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24);
    if (d < 7) return d + 'd ago';
    return new Date(ts).toLocaleDateString();
  }
  function renderMarkdown(text){
    try {
      if (window.marked && window.DOMPurify) {
        var raw = window.marked.parse(text, { breaks: true });
        return window.DOMPurify.sanitize(raw);
      }
    } catch (e) { console.error('markdown render failed', e); }
    return '<p>' + escapeHtml(text).replace(/\n/g, '<br>') + '</p>';
  }
  function sparkSVG(extraClass){
    return '<svg class="spark-mark ' + (extraClass || '') + '" viewBox="0 0 48 48" aria-hidden="true">' +
      '<defs><linearGradient id="sparkGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">' +
      '<stop offset="0" stop-color="#9478FF"/><stop offset="1" stop-color="#FF8A6B"/>' +
      '</linearGradient></defs>' +
      '<path d="M8 6 L22 6 L15 20 L26 20 L14 42 L18 24 L6 24 Z" fill="url(#sparkGrad)"/>' +
      '<path d="M40 6 L26 6 L33 20 L22 20 L34 42 L30 24 L42 24 Z" fill="url(#sparkGrad)"/>' +
      '</svg>';
  }

  /* ======================= confirm modal ======================= */
  var modalScrim = document.getElementById('modalScrim');
  var modalTitle = document.getElementById('modalTitle');
  var modalMessage = document.getElementById('modalMessage');
  var modalCancelBtn = document.getElementById('modalCancelBtn');
  var modalConfirmBtn = document.getElementById('modalConfirmBtn');
  var modalOnConfirm = null;

  function showConfirmModal(opts){
    modalTitle.textContent = opts.title;
    modalMessage.textContent = opts.message;
    modalConfirmBtn.textContent = opts.confirmLabel || 'Confirm';
    modalOnConfirm = opts.onConfirm;
    modalScrim.classList.add('show');
    modalConfirmBtn.focus();
  }
  function hideConfirmModal(){
    modalScrim.classList.remove('show');
    modalOnConfirm = null;
  }
  modalCancelBtn.addEventListener('click', hideConfirmModal);
  modalScrim.addEventListener('click', function(e){ if (e.target === modalScrim) hideConfirmModal(); });
  modalConfirmBtn.addEventListener('click', function(){
    var fn = modalOnConfirm;
    hideConfirmModal();
    if (fn) fn();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && modalScrim.classList.contains('show')) hideConfirmModal();
  });

  /* ======================= state ======================= */
  var state = {
    view: 'loading',
    profiles: [],
    profile: null,
    data: null,
    sending: false
  };

  var root = document.getElementById('app');

  /* ======================= init ======================= */
  function init(){
    storageGet('xtra_profiles').then(function(profiles){
      state.profiles = profiles || [];
      return storageGet('xtra_last_profile');
    }).then(function(lastId){
      if (state.profiles.length && lastId) {
        var p = null;
        for (var i = 0; i < state.profiles.length; i++) { if (state.profiles[i].id === lastId) p = state.profiles[i]; }
        if (p) { enterProfile(p); return; }
      }
      state.view = state.profiles.length ? 'picker' : 'create';
      render();
    });
  }

  function enterProfile(profile){
    state.profile = profile;
    storageGet('xtra_data_' + profile.id).then(function(data){
      state.data = data || { activeId: null, conversations: [] };
      storageSet('xtra_last_profile', profile.id);
      var hasActive = state.data.conversations.some(function(c){ return c.id === state.data.activeId; });
      if (!hasActive) newConversation(false);
      state.view = 'chat';
      render();
    });
  }

  function newConversation(persist){
    var conv = { id: uid(), title: null, messages: [], createdAt: Date.now(), updatedAt: Date.now() };
    state.data.conversations.unshift(conv);
    state.data.activeId = conv.id;
    if (persist !== false) saveData();
    return conv;
  }
  function saveData(){
    if (!state.profile) return Promise.resolve();
    return storageSet('xtra_data_' + state.profile.id, state.data);
  }
  function activeConversation(){
    var id = state.data.activeId;
    for (var i = 0; i < state.data.conversations.length; i++) {
      if (state.data.conversations[i].id === id) return state.data.conversations[i];
    }
    return null;
  }
  function sortedConversations(){
    return state.data.conversations.slice().sort(function(a, b){ return b.updatedAt - a.updatedAt; });
  }

  function createProfile(name){
    name = name.trim();
    if (!name) return;
    var profile = { id: uid(), name: name, hue: state.profiles.length % AVATAR_GRADIENTS.length, createdAt: Date.now() };
    state.profiles.push(profile);
    storageSet('xtra_profiles', state.profiles).then(function(){ enterProfile(profile); });
  }
  function switchProfile(){
    state.profile = null;
    state.data = null;
    state.view = state.profiles.length ? 'picker' : 'create';
    render();
  }

  /* ======================= rendering: dispatcher ======================= */
  function render(){
    if (state.view === 'loading') { root.innerHTML = ''; return; }
    if (state.view === 'create') { renderCreate(); return; }
    if (state.view === 'picker') { renderPicker(); return; }
    if (state.view === 'chat') { renderChat(); return; }
  }

  /* ======================= create profile view ======================= */
  function renderCreate(){
    var back = state.profiles.length ? '<button class="link-btn" id="backToPicker">&larr; Back</button>' : '';
    root.innerHTML =
      '<div class="auth-screen">' +
        '<div class="brand-row">' + sparkSVG() + '<span class="brand-word">XTRA AI</span></div>' +
        '<p class="brand-tagline">Chat with your own AI. It remembers every conversation.</p>' +
        '<div class="create-form">' +
          '<input type="text" id="nameInput" placeholder="What should we call you?" maxlength="30" autocomplete="off">' +
          '<button class="btn-primary" id="createBtn">Continue</button>' +
          back +
        '</div>' +
        '<p class="auth-footnote">This creates a profile so your chats are saved and waiting for you next time. Chats stay in your Claude account and are only visible to you.</p>' +
      '</div>';
    var input = document.getElementById('nameInput');
    var btn = document.getElementById('createBtn');
    input.focus();
    function submit(){ if (input.value.trim()) createProfile(input.value); }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
    var backBtn = document.getElementById('backToPicker');
    if (backBtn) backBtn.addEventListener('click', function(){ state.view = 'picker'; render(); });
  }

  /* ======================= picker view ======================= */
  function renderPicker(){
    var cards = state.profiles.map(function(p){
      return '<button class="profile-card" data-id="' + p.id + '">' +
        '<span class="profile-avatar" style="background:' + AVATAR_GRADIENTS[p.hue % AVATAR_GRADIENTS.length] + '">' + escapeHtml(initials(p.name)) + '</span>' +
        '<span class="profile-name">' + escapeHtml(p.name) + '</span>' +
      '</button>';
    }).join('');
    cards += '<button class="profile-card add-card" id="addProfileBtn">' +
      '<span class="add-icon">+</span><span class="profile-name">Add profile</span></button>';

    root.innerHTML =
      '<div class="auth-screen">' +
        '<div class="brand-row">' + sparkSVG() + '<span class="brand-word">XTRA AI</span></div>' +
        '<p class="brand-tagline">Welcome back. Pick a profile to continue.</p>' +
        '<div class="profile-grid">' + cards + '</div>' +
      '</div>';

    var grid = root.querySelector('.profile-grid');
    grid.addEventListener('click', function(e){
      var addBtn = e.target.closest('#addProfileBtn');
      if (addBtn) { state.view = 'create'; render(); return; }
      var card = e.target.closest('.profile-card');
      if (card) {
        var id = card.dataset.id;
        var profile = null;
        for (var i = 0; i < state.profiles.length; i++) { if (state.profiles[i].id === id) profile = state.profiles[i]; }
        if (profile) enterProfile(profile);
      }
    });
  }

  /* ======================= chat view ======================= */
  function renderChat(){
    root.innerHTML =
      '<div class="shell">' +
        '<div class="sidebar-scrim" id="sidebarScrim"></div>' +
        '<div class="sidebar" id="sidebarEl">' +
          '<div class="sidebar-header">' + sparkSVG() + '<span class="brand-word">XTRA AI</span></div>' +
          '<button class="new-chat-btn" id="newChatBtn">+ New chat</button>' +
          '<div class="conv-list" id="convListEl"></div>' +
          '<div class="sidebar-footer">' +
            '<div class="profile-chip" id="profileChip"></div>' +
            '<div class="footer-links">' +
              '<button class="link-btn" id="switchProfileBtn">Switch profile</button>' +
              '<button class="link-btn" id="resetDataBtn">Reset data</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="main">' +
          '<div class="main-header">' +
            '<button class="menu-toggle" id="menuToggleBtn" aria-label="Toggle sidebar">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>' +
            '</button>' +
            sparkSVG() + '<span class="brand-word">XTRA AI</span>' +
          '</div>' +
          '<div class="messages" id="messagesEl"></div>' +
          '<div class="composer">' +
            '<div class="composer-inner">' +
              '<textarea id="composerTextarea" rows="1" placeholder="Message XTRA AI…" aria-label="Message XTRA AI"></textarea>' +
              '<button class="send-btn" id="sendBtn" aria-label="Send message">' +
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>' +
              '</button>' +
            '</div>' +
            '<p class="composer-note">XTRA AI can make mistakes. Double-check anything important.</p>' +
          '</div>' +
        '</div>' +
      '</div>';

    wireChatEvents();
    refreshSidebar();
    refreshMessages();
  }

  function refreshSidebar(){
    var list = sortedConversations();
    var listEl = document.getElementById('convListEl');
    if (!list.length) {
      listEl.innerHTML = '<p class="conv-empty">No chats yet. Start one below.</p>';
    } else {
      listEl.innerHTML = list.map(function(c){
        var active = c.id === state.data.activeId ? ' active' : '';
        var title = c.title ? escapeHtml(c.title) : 'New chat';
        return '<div class="conv-item' + active + '" data-id="' + c.id + '" role="button" tabindex="0">' +
          '<span class="conv-title">' + title + '</span>' +
          '<button class="conv-delete" data-id="' + c.id + '" aria-label="Delete chat">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
          '</button>' +
        '</div>';
      }).join('');
    }
    var chip = document.getElementById('profileChip');
    if (state.profile) {
      chip.innerHTML =
        '<span class="profile-avatar" style="background:' + AVATAR_GRADIENTS[state.profile.hue % AVATAR_GRADIENTS.length] + '">' + escapeHtml(initials(state.profile.name)) + '</span>' +
        '<span class="profile-chip-name">' + escapeHtml(state.profile.name) + '</span>';
    }
  }

  function refreshMessages(){
    var messagesEl = document.getElementById('messagesEl');
    var conv = activeConversation();
    var msgs = conv ? conv.messages : [];

    if (!msgs.length && !state.sending) {
      var chips = SUGGESTIONS.map(function(s){
        return '<button class="chip" data-prompt="' + escapeHtml(s) + '">' + escapeHtml(s) + '</button>';
      }).join('');
      messagesEl.innerHTML =
        '<div class="welcome">' + sparkSVG() +
          '<h1>What are we working on?</h1>' +
          '<p>Ask anything. XTRA AI remembers this chat, and every chat you start, right where you left off.</p>' +
          '<div class="suggestion-chips">' + chips + '</div>' +
        '</div>';
      return;
    }

    var html = msgs.map(function(m, idx){
      if (m.role === 'user') {
        return '<div class="msg-row user" data-idx="' + idx + '">' +
          '<span class="msg-avatar" style="background:' + (state.profile ? AVATAR_GRADIENTS[state.profile.hue % AVATAR_GRADIENTS.length] : 'var(--ink-700)') + '"></span>' +
          '<div class="msg-col"><div class="msg-bubble">' + escapeHtml(m.content) + '</div></div>' +
        '</div>';
      }
      var bubbleClass = m.error ? 'msg-bubble is-error' : 'msg-bubble';
      var actions = '<div class="msg-actions">' +
        '<button class="msg-icon-btn copy-btn" data-idx="' + idx + '">copy</button>' +
        (m.error ? '<button class="msg-icon-btn retry-btn">retry</button>' : '') +
      '</div>';
      return '<div class="msg-row assistant" data-idx="' + idx + '">' +
        '<span class="msg-avatar ai">' + sparkSVG() + '</span>' +
        '<div class="msg-col"><div class="' + bubbleClass + '">' + renderMarkdown(m.content) + '</div>' + actions + '</div>' +
      '</div>';
    }).join('');

    if (state.sending) {
      html += '<div class="msg-row assistant">' +
        '<span class="msg-avatar ai">' + sparkSVG('thinking') + '</span>' +
        '<div class="msg-col"><div class="thinking-caption">XTRA AI is thinking</div></div>' +
      '</div>';
    }

    messagesEl.innerHTML = html;
    scrollToBottom();
  }

  function scrollToBottom(){
    var el = document.getElementById('messagesEl');
    if (!el) return;
    requestAnimationFrame(function(){ el.scrollTop = el.scrollHeight; });
  }

  function setComposerDisabled(disabled){
    var ta = document.getElementById('composerTextarea');
    var btn = document.getElementById('sendBtn');
    if (ta) ta.disabled = disabled;
    if (btn) btn.disabled = disabled;
  }

  /* ======================= sending messages ======================= */
  function requestReply(conv){
    state.sending = true;
    refreshMessages();
    setComposerDisabled(true);

    var payload = {
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: conv.messages.map(function(m){ return { role: m.role, content: m.content }; })
    };

    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(res){
      if (!res.ok) {
        return res.json().catch(function(){ return null; }).then(function(errJson){
          var msg = (errJson && errJson.error && errJson.error.message) ? errJson.error.message : ('Request failed (' + res.status + ')');
          throw new Error(msg);
        });
      }
      return res.json();
    }).then(function(data){
      var text = (data.content || []).filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('\n').trim();
      conv.messages.push({ role: 'assistant', content: text || '(No response text returned.)', ts: Date.now() });
    }).catch(function(err){
      var msg = (err && err.message) ? err.message : 'Something went wrong reaching XTRA AI. Try again.';
      conv.messages.push({ role: 'assistant', content: msg, ts: Date.now(), error: true });
    }).then(function(){
      state.sending = false;
      conv.updatedAt = Date.now();
      saveData();
      refreshSidebar();
      refreshMessages();
      setComposerDisabled(false);
      var ta = document.getElementById('composerTextarea');
      if (ta) ta.focus();
    });
  }

  function sendMessage(text){
    if (!text.trim() || state.sending) return;
    var conv = activeConversation();
    if (!conv) conv = newConversation();
    conv.messages.push({ role: 'user', content: text.trim(), ts: Date.now() });
    if (!conv.title) conv.title = truncate(text, 42);
    conv.updatedAt = Date.now();
    saveData();
    refreshSidebar();
    refreshMessages();
    requestReply(conv);
  }

  function handleRetry(){
    var conv = activeConversation();
    if (!conv || !conv.messages.length) return;
    var last = conv.messages[conv.messages.length - 1];
    if (last.role === 'assistant' && last.error) conv.messages.pop();
    refreshMessages();
    requestReply(conv);
  }

  function handleCopy(btn){
    var conv = activeConversation();
    var idx = parseInt(btn.dataset.idx, 10);
    if (!conv || !conv.messages[idx]) return;
    var text = conv.messages[idx].content;
    var original = btn.textContent;
    function flash(){ btn.textContent = 'copied'; setTimeout(function(){ btn.textContent = original; }, 1200); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash).catch(function(){
        fallbackCopy(text); flash();
      });
    } else {
      fallbackCopy(text); flash();
    }
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  function removeConversation(id){
    state.data.conversations = state.data.conversations.filter(function(c){ return c.id !== id; });
    if (state.data.activeId === id) {
      var remaining = sortedConversations();
      if (remaining.length) {
        state.data.activeId = remaining[0].id;
      } else {
        newConversation(false);
      }
    }
    saveData();
    refreshSidebar();
    refreshMessages();
  }

  function closeMobileSidebar(){
    var sidebarEl = document.getElementById('sidebarEl');
    var scrim = document.getElementById('sidebarScrim');
    if (sidebarEl) sidebarEl.classList.remove('open');
    if (scrim) scrim.classList.remove('show');
  }

  /* ======================= wire chat events ======================= */
  function wireChatEvents(){
    var ta = document.getElementById('composerTextarea');
    var sendBtn = document.getElementById('sendBtn');
    var newChatBtn = document.getElementById('newChatBtn');
    var convListEl = document.getElementById('convListEl');
    var messagesEl = document.getElementById('messagesEl');
    var switchBtn = document.getElementById('switchProfileBtn');
    var resetBtn = document.getElementById('resetDataBtn');
    var menuBtn = document.getElementById('menuToggleBtn');
    var sidebarEl = document.getElementById('sidebarEl');
    var scrimEl = document.getElementById('sidebarScrim');

    function autoresize(){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px'; }
    function submitComposer(){
      var text = ta.value;
      if (!text.trim() || state.sending) return;
      ta.value = '';
      autoresize();
      sendMessage(text);
    }
    ta.addEventListener('input', autoresize);
    ta.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitComposer(); }
    });
    sendBtn.addEventListener('click', submitComposer);

    newChatBtn.addEventListener('click', function(){
      newConversation();
      refreshSidebar();
      refreshMessages();
      closeMobileSidebar();
      ta.focus();
    });

    convListEl.addEventListener('click', function(e){
      var delBtn = e.target.closest('.conv-delete');
      if (delBtn) {
        var id = delBtn.dataset.id;
        showConfirmModal({
          title: 'Delete this chat?',
          message: "This chat and its messages will be removed. This can't be undone.",
          confirmLabel: 'Delete',
          onConfirm: function(){ removeConversation(id); }
        });
        return;
      }
      var item = e.target.closest('.conv-item');
      if (item) {
        state.data.activeId = item.dataset.id;
        saveData();
        refreshSidebar();
        refreshMessages();
        closeMobileSidebar();
      }
    });

    messagesEl.addEventListener('click', function(e){
      var chip = e.target.closest('.chip');
      if (chip) { ta.value = chip.dataset.prompt; autoresize(); ta.focus(); return; }
      var copyBtn = e.target.closest('.copy-btn');
      if (copyBtn) { handleCopy(copyBtn); return; }
      var retryBtn = e.target.closest('.retry-btn');
      if (retryBtn) { handleRetry(); return; }
    });

    switchBtn.addEventListener('click', switchProfile);

    resetBtn.addEventListener('click', function(){
      showConfirmModal({
        title: 'Reset all your data?',
        message: 'Every chat in this profile will be permanently deleted.',
        confirmLabel: 'Reset',
        onConfirm: function(){
          storageDelete('xtra_data_' + state.profile.id).then(function(){
            state.data = { activeId: null, conversations: [] };
            newConversation(false);
            saveData();
            renderChat();
          });
        }
      });
    });

    menuBtn.addEventListener('click', function(){
      sidebarEl.classList.toggle('open');
      scrimEl.classList.toggle('show');
    });
    scrimEl.addEventListener('click', closeMobileSidebar);
  }

  init();
})();
</script>
</body>
</html>
